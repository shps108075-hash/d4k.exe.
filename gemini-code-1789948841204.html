<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D4K Executor Hub</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px 20px;
            margin: 0;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }
        h1 {
            color: #38bdf8;
            margin-bottom: 10px;
        }
        p {
            color: #94a3b8;
            margin-bottom: 30px;
        }
        .btn {
            display: inline-block;
            background-color: #2563eb;
            color: white;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            margin: 10px;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: #1d4ed8;
        }
        .code-box {
            background: #0f172a;
            border: 1px solid #334155;
            padding: 15px;
            border-radius: 6px;
            text-align: left;
            font-family: monospace;
            color: #4ade80;
            overflow-x: auto;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>D4K Mobile Hub</h1>
        <p>歡迎來到專屬的 Roblox 外掛與指令碼發布頁面</p>
        
        <!-- 下載按鈕（如果有 APK 連結可以換掉裡面的 #） -->
        <a href="#" class="btn">下載 Roblox APK</a>
        
        <div class="code-box">
            -- 你的 Lua 外掛範例程式碼<br>
            print("D4K Script Loaded Successfully!")<br>
            -- 可以在這裡放你的載入語法
        </div>
    </div>

</body>
</html>
